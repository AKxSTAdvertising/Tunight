<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070a">
  <meta name="description" content="Kage — Where stillness reveals the unseen. An interactive night walk through a Kyoto mountain temple.">
  <title>Kage — Where stillness reveals the unseen</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@designcodeio/threeui@1.2.0/style.css">
  <style>
    html,body,#root{width:100%;height:100%;min-height:100%;margin:0;background:#05070a}
    body{overflow:hidden}
    .shader-frame{position:relative;width:100%;height:100vh;height:100dvh;min-height:100vh;overflow:hidden;background:#05070a}
    #load-error{position:fixed;inset:0;display:grid;place-content:center;gap:1rem;padding:2rem;text-align:center;background:#05070a;color:#dfe7e0;font:16px/1.6 system-ui,sans-serif}
    #load-error a{color:#ff5a3c}
  </style>
  <script type="importmap">
    {"imports":{"react":"https://esm.sh/react@18.3.1","react-dom/client":"https://esm.sh/react-dom@18.3.1/client?external=react"}}
  </script>
</head>
<body>
  <div id="root"><div id="load-error">Loading the Kage temple experience…</div></div>
  <script type="module">
    const rootNode = document.getElementById("root");
    try {
      const [ReactModule, ReactDOM, ThreeUI, pageResponse] = await Promise.all([
        import("react"),
        import("react-dom/client"),
        import("https://esm.sh/@designcodeio/threeui@1.2.0?external=react"),
        fetch("public/landing-pages/kage.html")
      ]);
      if (!pageResponse.ok) throw new Error("Could not load the original Kage HTML source.");
      const srcDoc = await pageResponse.text();
      const React = ReactModule.default;
      ReactDOM.createRoot(rootNode).render(
        React.createElement("div", { className: "shader-frame" },
          React.createElement(ThreeUI.KageLandingPage, {
            srcDoc,
            headingFont: "onest",
            bodyFont: "onest",
            headingWeight: "600",
            bodyWeight: "500",
            primaryColor: "#e0231c",
            headingSize: 67,
            bodySize: 17,
            headingLetterSpacing: -0.012
          })
        )
      );
    } catch (error) {
      rootNode.innerHTML = '<div id="load-error"><strong>Kage is temporarily unavailable.</strong><span>Check your connection and reload to load the ThreeUI renderer.</span><a href="kage.html">Open the original Kage page directly</a></div>';
      console.error(error);
    }
  </script>
</body>
</html>
